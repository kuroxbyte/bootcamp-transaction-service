openapi: 3.0.3
info:
  title: Transaction Service API
  description: |
    Transacciones y consultas sobre los productos del cliente: depósitos y retiros en cuentas
    bancarias, pagos de créditos, consumos y pagos de tarjetas de crédito, saldos y movimientos.
    La fecha de cada transacción la asigna el servidor.
  version: 1.0.0
servers:
  - url: http://localhost:8084
    description: Local
tags:
  - name: AccountTransactions
    description: Depósitos, retiros, saldo y movimientos de cuentas bancarias
  - name: CreditTransactions
    description: Pagos y movimientos de créditos personales y empresariales
  - name: CreditCardTransactions
    description: Consumos, pagos, crédito disponible y movimientos de tarjetas de crédito
  - name: Reports
    description: Reportes del banco
  - name: DebitCardTransactions
    description: Pagos con tarjetas de débito
paths:
  /api/v1/accounts/{accountId}/deposits:
    post:
      tags: [AccountTransactions]
      operationId: deposit
      summary: Depositar en una cuenta del cliente
      description: |
        Ahorro respeta el límite mensual de movimientos; plazo fijo solo el día configurado y uno por mes.
        Superadas las transacciones sin comisión del mes, el depósito paga la comisión fija de la cuenta,
        que se descuenta del saldo.
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        $ref: '#/components/requestBodies/Amount'
      responses:
        '201':
          $ref: '#/components/responses/MovementCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/{accountId}/withdrawals:
    post:
      tags: [AccountTransactions]
      operationId: withdraw
      summary: Retirar de una cuenta del cliente
      description: |
        Además de las reglas del tipo de cuenta, el saldo debe cubrir el monto más la comisión.
        Superadas las transacciones sin comisión del mes, el retiro paga la comisión fija de la cuenta.
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        $ref: '#/components/requestBodies/Amount'
      responses:
        '201':
          $ref: '#/components/responses/MovementCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/{accountId}/transfers/own:
    post:
      tags: [AccountTransactions]
      operationId: transferToOwnAccount
      summary: Transferir a otra cuenta del mismo cliente
      description: |
        La cuenta origen ({accountId}) y la destino deben ser del cliente y distintas.
        En el origen se trata como un retiro y en el destino como un depósito: aplican las reglas de
        cada tipo de cuenta y cuenta para sus transacciones sin comisión del mes; cada cuenta paga su
        propia comisión. El saldo del origen debe cubrir el monto más su comisión.
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        $ref: '#/components/requestBodies/Transfer'
      responses:
        '201':
          $ref: '#/components/responses/TransferCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/{accountId}/transfers/third-party:
    post:
      tags: [AccountTransactions]
      operationId: transferToThirdParty
      summary: Transferir a una cuenta de otro cliente del mismo banco
      description: |
        La cuenta origen ({accountId}) debe ser del cliente y la destino de otro cliente del banco.
        Mismas reglas que la transferencia entre cuentas propias.
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        $ref: '#/components/requestBodies/Transfer'
      responses:
        '201':
          $ref: '#/components/responses/TransferCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/{accountId}/balance:
    get:
      tags: [AccountTransactions]
      operationId: getAccountBalance
      summary: Consultar el saldo disponible de una cuenta del cliente
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Saldo disponible (depósitos menos retiros)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/{accountId}/daily-average:
    get:
      tags: [AccountTransactions]
      operationId: getAccountDailyAverage
      summary: Consultar el saldo promedio diario de una cuenta del cliente en un mes
      description: |
        Promedia el saldo al final de cada día del mes en que la cuenta estuvo abierta, hasta hoy.
        Si la cuenta exige un monto mínimo de promedio diario (ahorro VIP), indica si lo alcanza.
        Es informativo: no bloquea ni cobra nada.
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/AccountId'
        - name: month
          in: query
          required: true
          description: Mes consultado (YYYY-MM)
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-11'
      responses:
        '200':
          description: Saldo promedio diario del mes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyAverageBalanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/{accountId}/movements:
    get:
      tags: [AccountTransactions]
      operationId: getAccountMovements
      summary: Consultar los movimientos de una cuenta del cliente
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          $ref: '#/components/responses/ProductMovements'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/credits/{creditId}/payments:
    post:
      tags: [CreditTransactions]
      operationId: payCredit
      summary: Pagar un crédito del cliente
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/CreditId'
      requestBody:
        $ref: '#/components/requestBodies/Amount'
      responses:
        '201':
          $ref: '#/components/responses/PaymentCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/credits/{creditId}/payments/third-party:
    post:
      tags: [CreditTransactions]
      operationId: payThirdPartyCredit
      summary: Pagar el crédito de otro cliente del banco
      description: |
        El crédito debe existir y ser de otro cliente (si es propio, 422: se usa el pago propio).
        El pago no se descuenta de ninguna cuenta; guarda quién pagó (payerCustomerId) y reduce la
        deuda del dueño del crédito.
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/CreditId'
      requestBody:
        $ref: '#/components/requestBodies/Amount'
      responses:
        '201':
          $ref: '#/components/responses/PaymentCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/credits/{creditId}/movements:
    get:
      tags: [CreditTransactions]
      operationId: getCreditMovements
      summary: Consultar los movimientos (pagos) de un crédito del cliente
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/CreditId'
      responses:
        '200':
          $ref: '#/components/responses/ProductMovements'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/credit-cards/{creditCardId}/charges:
    post:
      tags: [CreditCardTransactions]
      operationId: chargeCreditCard
      summary: Cargar un consumo a una tarjeta del cliente
      description: El consumo no puede superar el crédito disponible (límite menos deuda).
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/CreditCardId'
      requestBody:
        $ref: '#/components/requestBodies/Amount'
      responses:
        '201':
          description: Consumo registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/credit-cards/{creditCardId}/payments:
    post:
      tags: [CreditCardTransactions]
      operationId: payCreditCard
      summary: Pagar una tarjeta del cliente
      description: El pago reduce la deuda y libera crédito disponible.
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/CreditCardId'
      requestBody:
        $ref: '#/components/requestBodies/Amount'
      responses:
        '201':
          $ref: '#/components/responses/PaymentCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/credit-cards/{creditCardId}/payments/third-party:
    post:
      tags: [CreditCardTransactions]
      operationId: payThirdPartyCreditCard
      summary: Pagar la tarjeta de otro cliente del banco
      description: |
        La tarjeta debe existir y ser de otro cliente (si es propia, 422: se usa el pago propio).
        El pago no se descuenta de ninguna cuenta; guarda quién pagó (payerCustomerId), reduce la
        deuda de la tarjeta y libera crédito disponible para su dueño.
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/CreditCardId'
      requestBody:
        $ref: '#/components/requestBodies/Amount'
      responses:
        '201':
          $ref: '#/components/responses/PaymentCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/credit-cards/{creditCardId}/available-credit:
    get:
      tags: [CreditCardTransactions]
      operationId: getCreditCardAvailableCredit
      summary: Consultar el crédito disponible de una tarjeta del cliente
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/CreditCardId'
      responses:
        '200':
          description: Crédito disponible (límite menos deuda)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableCreditResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/credit-cards/{creditCardId}/movements:
    get:
      tags: [CreditCardTransactions]
      operationId: getCreditCardMovements
      summary: Consultar los movimientos (consumos y pagos) de una tarjeta del cliente
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/CreditCardId'
      responses:
        '200':
          $ref: '#/components/responses/ProductMovements'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/reports/products:
    get:
      tags: [Reports]
      operationId: getProductReport
      summary: Reporte general del banco por tipo de producto en un intervalo de fechas
      description: |
        Uso administrativo: no se filtra por cliente. Por cada tipo de producto informa los productos
        abiertos u otorgados en el intervalo, la cantidad y el monto de cada tipo de movimiento, el
        total de transacciones y las comisiones por transacción cobradas. Ambas fechas se incluyen.
      parameters:
        - name: from
          in: query
          required: true
          description: Primer día del intervalo (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: '2026-11-01'
        - name: to
          in: query
          required: true
          description: Último día del intervalo (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: '2026-11-30'
      responses:
        '200':
          description: Reporte por tipo de producto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/reports/credit-cards/{creditCardId}/last-movements:
    get:
      tags: [Reports]
      operationId: getCreditCardLastMovements
      summary: Últimos 10 movimientos de una tarjeta de crédito del cliente
      description: |
        Consumos y pagos de la tarjeta, del más reciente al más antiguo (máximo 10). Los movimientos
        tienen fecha sin hora: entre los del mismo día no se garantiza el orden.
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/CreditCardId'
      responses:
        '200':
          $ref: '#/components/responses/ProductMovements'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/reports/debit-cards/{debitCardId}/last-movements:
    get:
      tags: [Reports]
      operationId: getDebitCardLastMovements
      summary: Últimos 10 pagos con una tarjeta de débito del cliente
      description: |
        Pagos hechos con la tarjeta, de cualquiera de sus cuentas, del más reciente al más antiguo
        (máximo 10). Los movimientos tienen fecha sin hora: entre los del mismo día no se garantiza
        el orden.
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/DebitCardId'
      responses:
        '200':
          $ref: '#/components/responses/ProductMovements'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
  /api/v1/debit-cards/{debitCardId}/payments:
    post:
      tags: [DebitCardTransactions]
      operationId: payWithDebitCard
      summary: Pagar con una tarjeta de débito del cliente
      description: |
        El pago sale solo de la cuenta principal de la tarjeta y se trata como un retiro: aplican el
        límite mensual del ahorro, el día del plazo fijo y las transacciones sin comisión; el saldo
        debe cubrir el monto más la comisión. transaction-service conoce las tarjetas por los
        eventos de account-service; una tarjeta recién emitida puede tardar unos instantes en
        estar disponible.
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
        - $ref: '#/components/parameters/DebitCardId'
      requestBody:
        $ref: '#/components/requestBodies/Amount'
      responses:
        '201':
          $ref: '#/components/responses/MovementCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    DebitCardId:
      name: debitCardId
      in: path
      required: true
      description: Id de la tarjeta de débito
      schema:
        type: string
    XCustomerId:
      name: X-Customer-Id
      in: header
      required: true
      description: Id del cliente que realiza la operación; debe ser el dueño del producto. Lo establece el API Gateway con el claim sub del JWT; el valor que envía el cliente se descarta
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      description: Id de la cuenta bancaria
      schema:
        type: string
    CreditId:
      name: creditId
      in: path
      required: true
      description: Id del crédito
      schema:
        type: string
    CreditCardId:
      name: creditCardId
      in: path
      required: true
      description: Id de la tarjeta de crédito
      schema:
        type: string
  requestBodies:
    Transfer:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransferRequest'
    Amount:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AmountRequest'
  schemas:
    TransferRequest:
      type: object
      required: [targetAccountId, amount]
      properties:
        targetAccountId:
          type: string
          description: Cuenta destino del mismo banco
          example: 6650f1c2a4b5c6d7e8f90456
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 100.00
    TransferType:
      type: string
      description: Transferencia entre cuentas propias o a un tercero del mismo banco
      enum: [OWN, THIRD_PARTY]
    TransferResponse:
      type: object
      required: [type, sourceAccountId, targetAccountId, amount, date, sourceCommission, targetCommission]
      properties:
        type:
          $ref: '#/components/schemas/TransferType'
        sourceAccountId:
          type: string
        targetAccountId:
          type: string
        amount:
          type: number
          example: 100.00
        date:
          type: string
          format: date
        sourceCommission:
          type: number
          description: Comisión que pagó la cuenta origen
          example: 0
        targetCommission:
          type: number
          description: Comisión que pagó la cuenta destino
          example: 0
    AmountRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 100.00
    MovementType:
      type: string
      description: Tipo de movimiento de una cuenta bancaria
      enum: [DEPOSIT, WITHDRAWAL, DEBIT_CARD_PAYMENT]
    MovementResponse:
      type: object
      required: [accountId, type, amount, date, commission]
      properties:
        accountId:
          type: string
        type:
          $ref: '#/components/schemas/MovementType'
        amount:
          type: number
          example: 100.00
        date:
          type: string
          format: date
        commission:
          type: number
          description: Comisión cobrada (0 si está dentro de las transacciones sin comisión del mes); se descuenta del saldo
          example: 0
        debitCardId:
          type: string
          description: Solo DEBIT_CARD_PAYMENT; tarjeta de débito con la que se pagó
    PaymentTarget:
      type: string
      description: Producto de crédito al que se aplica el pago
      enum: [CREDIT, CREDIT_CARD]
    PaymentResponse:
      type: object
      required: [target, productId, amount, date, payerCustomerId]
      properties:
        target:
          $ref: '#/components/schemas/PaymentTarget'
        productId:
          type: string
          description: Id del crédito o de la tarjeta, según target
        amount:
          type: number
          example: 250.00
        date:
          type: string
          format: date
        payerCustomerId:
          type: string
          description: Cliente que hizo el pago (el dueño del producto o un tercero)
    ChargeResponse:
      type: object
      required: [creditCardId, amount, date]
      properties:
        creditCardId:
          type: string
        amount:
          type: number
          example: 80.50
        date:
          type: string
          format: date
    AccountBalanceResponse:
      type: object
      required: [accountId, balance]
      properties:
        accountId:
          type: string
        balance:
          type: number
          example: 1250.00
    DailyAverageBalanceResponse:
      type: object
      required: [accountId, month, days, averageDailyBalance]
      properties:
        accountId:
          type: string
        month:
          type: string
          example: '2026-11'
        days:
          type: integer
          format: int32
          description: Días del mes en que la cuenta estuvo abierta hasta hoy
          example: 15
        averageDailyBalance:
          type: number
          description: Saldo promedio diario de esos días
          example: 640.50
        minimumDailyAverage:
          type: number
          description: Solo si la cuenta lo exige (ahorro VIP); monto mínimo de promedio diario del mes
          example: 500
        meetsMinimum:
          type: boolean
          description: Solo si la cuenta exige un mínimo; indica si el promedio lo alcanza
    AvailableCreditResponse:
      type: object
      required: [creditCardId, availableCredit]
      properties:
        creditCardId:
          type: string
        availableCredit:
          type: number
          example: 4200.00
    ProductMovementType:
      type: string
      description: Tipo de movimiento de un producto bancario
      enum:
        - DEPOSIT
        - WITHDRAWAL
        - TRANSFER_IN
        - TRANSFER_OUT
        - DEBIT_CARD_PAYMENT
        - YANKI_PAYMENT_SENT
        - YANKI_PAYMENT_RECEIVED
        - YANKI_PAYMENT_REVERSAL
        - CHARGE
        - PAYMENT
    ProductType:
      type: string
      description: Tipo de producto del banco
      enum: [SAVINGS, CHECKING, FIXED_TERM, PERSONAL_CREDIT, BUSINESS_CREDIT, CREDIT_CARD]
    MovementTotalResponse:
      type: object
      required: [type, count, amount]
      properties:
        type:
          $ref: '#/components/schemas/ProductMovementType'
        count:
          type: integer
          format: int64
          example: 12
        amount:
          type: number
          description: Suma de los montos, sin comisiones
          example: 1500.00
    ProductTypeReportResponse:
      type: object
      required: [productType, openedProducts, transactions, commissions, movements]
      properties:
        productType:
          $ref: '#/components/schemas/ProductType'
        openedProducts:
          type: integer
          format: int64
          description: Productos abiertos u otorgados en el intervalo
          example: 3
        transactions:
          type: integer
          format: int64
          description: Total de movimientos del intervalo
          example: 12
        commissions:
          type: number
          description: Comisiones por transacción cobradas en el intervalo
          example: 4.00
        movements:
          type: array
          description: Cantidad y monto por tipo de movimiento; solo los tipos que tuvieron movimientos
          items:
            $ref: '#/components/schemas/MovementTotalResponse'
    ProductReportResponse:
      type: object
      required: [from, to, products]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        products:
          type: array
          description: Un resumen por cada tipo de producto
          items:
            $ref: '#/components/schemas/ProductTypeReportResponse'
    ProductMovementResponse:
      type: object
      required: [type, amount, date]
      properties:
        type:
          $ref: '#/components/schemas/ProductMovementType'
        amount:
          type: number
          example: 100.00
        date:
          type: string
          format: date
        commission:
          type: number
          description: Solo movimientos de cuentas (DEPOSIT, WITHDRAWAL, TRANSFER_IN, TRANSFER_OUT); comisión cobrada
          example: 0
    Problem:
      type: object
      description: Detalle de error (RFC 7807)
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
  responses:
    TransferCreated:
      description: Transferencia realizada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransferResponse'
    MovementCreated:
      description: Movimiento registrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MovementResponse'
    PaymentCreated:
      description: Pago registrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentResponse'
    ProductMovements:
      description: Movimientos del producto ordenados por fecha, del más antiguo al más reciente (vacío si no tiene)
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ProductMovementResponse'
    BadRequest:
      description: Datos de entrada inválidos o falta el header X-Customer-Id
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProductNotFound:
      description: El producto no existe o no pertenece al cliente
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BusinessRuleViolation:
      description: Se incumple una regla de negocio (límite de movimientos, saldo o crédito insuficiente, día no permitido)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: account-service o credit-service no está disponible
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
