openapi: 3.0.3
info:
  title: Account Service API
  description: Apertura y consulta de cuentas bancarias (ahorro, corriente y plazo fijo).
  version: 1.0.0
servers:
  - url: http://localhost:8082
    description: Local
tags:
  - name: Accounts
    description: Cuentas bancarias (pasivos)
paths:
  /api/v1/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: Listar las cuentas del cliente
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
      responses:
        '200':
          description: Cuentas del cliente (vacío si no tiene)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/accounts/savings:
    post:
      tags: [Accounts]
      operationId: openSavingsAccount
      summary: Abrir una cuenta de ahorro
      description: |
        Sin comisión de mantenimiento y con límite máximo de movimientos mensuales.
        Cada mes, los depósitos y retiros que superan las transacciones sin comisión del tipo de
        cuenta pagan una comisión fija (ambos valores se configuran por tipo).
        Un cliente personal solo puede tener una; un cliente empresarial no puede tener ninguna.
        Si el cliente es VIP, la cuenta es de ahorro VIP: exige un monto mínimo de promedio diario
        cada mes y el cliente debe tener una tarjeta de crédito con el banco al abrirla.
        El monto de apertura debe ser al menos el mínimo configurado para el tipo (puede ser 0).
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavingsAccountRequest'
      responses:
        '201':
          $ref: '#/components/responses/AccountCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/CustomerNotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/checking:
    post:
      tags: [Accounts]
      operationId: openCheckingAccount
      summary: Abrir una cuenta corriente
      description: |
        Con comisión de mantenimiento y sin límite de movimientos mensuales.
        Cada mes, los depósitos y retiros que superan las transacciones sin comisión del tipo de
        cuenta pagan una comisión fija (ambos valores se configuran por tipo).
        Un cliente personal solo puede tener una; un cliente empresarial puede tener varias
        y debe indicar al menos un titular (los firmantes autorizados son opcionales).
        Si el cliente es PYME, la cuenta no tiene comisión de mantenimiento (se omite o se envía 0)
        y el cliente debe tener una tarjeta de crédito con el banco al abrirla.
        El monto de apertura debe ser al menos el mínimo configurado para el tipo (puede ser 0).
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckingAccountRequest'
      responses:
        '201':
          $ref: '#/components/responses/AccountCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/CustomerNotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/fixed-term:
    post:
      tags: [Accounts]
      operationId: openFixedTermAccount
      summary: Abrir una cuenta a plazo fijo
      description: |
        Sin comisión de mantenimiento; permite un solo depósito o retiro al mes, en el día indicado.
        Cada mes, los depósitos y retiros que superan las transacciones sin comisión del tipo de
        cuenta pagan una comisión fija (ambos valores se configuran por tipo).
        Un cliente personal puede tener varias; un cliente empresarial no puede tener ninguna.
        El monto de apertura debe ser al menos el mínimo configurado para el tipo (puede ser 0).
      parameters:
        - $ref: '#/components/parameters/XCustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedTermAccountRequest'
      responses:
        '201':
          $ref: '#/components/responses/AccountCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/CustomerNotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/internal/accounts:
    get:
      tags: [Accounts]
      operationId: listAllAccounts
      summary: Listar todas las cuentas del banco
      description: Uso interno; transaction-service lo usa para el reporte general por producto y para cobrar las comisiones mensuales. El API Gateway no lo expone.
      responses:
        '200':
          description: Todas las cuentas (vacío si no hay)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
  /api/v1/accounts/{accountId}:
    get:
      tags: [Accounts]
      operationId: getAccountById
      summary: Consultar una cuenta
      description: Uso interno; transaction-service lo usa para validar al dueño y las reglas de movimientos.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Cuenta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    XCustomerId:
      name: X-Customer-Id
      in: header
      required: true
      description: Id del cliente que realiza la operación. Lo establece el API Gateway con el claim sub del JWT; el valor que envía el cliente se descarta
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      description: Id de la cuenta
      schema:
        type: string
  schemas:
    AccountType:
      type: string
      description: Tipo de cuenta bancaria
      enum: [SAVINGS, CHECKING, FIXED_TERM]
    SavingsAccountRequest:
      type: object
      required: [maxMonthlyMovements, openingAmount]
      properties:
        openingAmount:
          type: number
          minimum: 0
          description: Monto de apertura; debe ser al menos el mínimo de apertura del tipo de cuenta (que puede ser 0). Es el saldo inicial.
          example: 0
        maxMonthlyMovements:
          type: integer
          format: int32
          minimum: 1
          description: Límite máximo de movimientos mensuales
          example: 5
    CheckingAccountRequest:
      type: object
      required: [openingAmount]
      properties:
        openingAmount:
          type: number
          minimum: 0
          description: Monto de apertura; debe ser al menos el mínimo de apertura del tipo de cuenta (que puede ser 0). Es el saldo inicial.
          example: 0
        maintenanceFee:
          type: number
          minimum: 0
          description: Comisión de mantenimiento; obligatoria y mayor a 0, salvo si el cliente es PYME (se omite o es 0)
          example: 15.00
        holderIds:
          type: array
          description: Titulares; obligatorio al menos uno si el cliente es empresarial
          items:
            type: string
        authorizedSignerIds:
          type: array
          description: Firmantes autorizados (opcional)
          items:
            type: string
    FixedTermAccountRequest:
      type: object
      required: [movementDayOfMonth, openingAmount]
      properties:
        openingAmount:
          type: number
          minimum: 0
          description: Monto de apertura; debe ser al menos el mínimo de apertura del tipo de cuenta (que puede ser 0). Es el saldo inicial.
          example: 0
        movementDayOfMonth:
          type: integer
          format: int32
          minimum: 1
          maximum: 31
          description: Día del mes en que se permite el único movimiento
          example: 15
    AccountResponse:
      type: object
      description: Cuenta bancaria; los campos propios de cada tipo solo vienen en ese tipo.
      required: [id, customerId, type, minimumOpeningAmount, openingAmount, openedAt, freeMonthlyTransactions, transactionFee]
      properties:
        id:
          type: string
          example: 6650f1c2a4b5c6d7e8f90456
        customerId:
          type: string
          example: 6650f1c2a4b5c6d7e8f90123
        type:
          $ref: '#/components/schemas/AccountType'
        maxMonthlyMovements:
          type: integer
          format: int32
          description: Solo SAVINGS
        minimumDailyAverage:
          type: number
          description: Solo SAVINGS de un cliente VIP; monto mínimo de promedio diario que exige cada mes
          example: 500
        maintenanceFee:
          type: number
          description: Solo CHECKING
        holderIds:
          type: array
          description: Solo CHECKING
          items:
            type: string
        authorizedSignerIds:
          type: array
          description: Solo CHECKING
          items:
            type: string
        movementDayOfMonth:
          type: integer
          format: int32
          description: Solo FIXED_TERM
        minimumOpeningAmount:
          type: number
          description: Monto mínimo de apertura del tipo de cuenta al momento de abrirla
          example: 0
        openingAmount:
          type: number
          description: Monto con el que se abrió la cuenta (saldo inicial)
          example: 0
        openedAt:
          type: string
          format: date
          description: Fecha de apertura de la cuenta
          example: '2026-11-15'
        freeMonthlyTransactions:
          type: integer
          format: int32
          description: Depósitos y retiros al mes sin comisión, según el tipo de cuenta al abrirla
          example: 3
        transactionFee:
          type: number
          description: Comisión fija por cada depósito o retiro que supera las transacciones sin comisión del mes
          example: 2.00
    Problem:
      type: object
      description: Detalle de error (RFC 7807)
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
  responses:
    AccountCreated:
      description: Cuenta creada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountResponse'
    BadRequest:
      description: Datos de entrada inválidos o falta el header X-Customer-Id
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: El recurso no existe
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CustomerNotFound:
      description: El cliente no existe
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BusinessRuleViolation:
      description: Se incumple una regla de negocio (por ejemplo, límite de cuentas por tipo de cliente)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: customer-service o credit-service no está disponible
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
