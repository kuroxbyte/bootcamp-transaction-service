# Configuración de las pruebas: no se consulta config-server.
spring:
  config:
    # Toma la configuración común (circuit breaker y timeout) de config-repo.
    import: optional:file:../config-repo/application.yaml
  application:
    name: transaction-service
  cloud:
    config:
      enabled: false
  mongodb:
    uri: mongodb://localhost:27017/transaction_test_db
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      # Las pruebas no crean tópicos ni esperan a un broker.
      auto-create: false
    listener:
      # El consumidor se prueba directamente, sin broker.
      auto-startup: false

messaging:
  topics:
    transaction-events: transaction-events
    debit-card-events: debit-card-events
    yanki-operations: yanki-operations
    yanki-operation-results: yanki-operation-results

cache:
  debit-cards:
    ttl: 10m

clients:
  account-service:
    base-url: http://account-service
    timeout: 3s
  credit-service:
    base-url: http://credit-service
    timeout: 3s

eureka:
  client:
    # Las pruebas no se registran en Eureka.
    enabled: false

fees:
  monthly:
    # Nunca durante las pruebas (31 de febrero).
    cron: "0 0 0 31 2 *"
    minimum-average-fee: 15.00
